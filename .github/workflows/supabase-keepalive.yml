# Free-tier Supabase projects pause after ~7 days of inactivity (this took the app down once).
# A twice-weekly read keeps it active. Required repo secrets: SUPABASE_URL, SUPABASE_ANON_KEY.
name: supabase-keepalive
on:
  schedule:
    - cron: '17 3 * * 1,4'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row from projects
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" "${{ secrets.SUPABASE_URL }}/rest/v1/projects?select=id&limit=1")
          echo "status=$code"
          test "$code" = 200
